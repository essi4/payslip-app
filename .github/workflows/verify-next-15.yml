name: Verify Next 15 Migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  next-15-verification:
    if: github.head_ref == 'security/next-15-5-26'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: security/next-15-5-26
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install from committed lockfile
        run: npm ci --ignore-scripts

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build
