name: Verify Next 15 Migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  next-15-migration:
    if: github.head_ref == 'security/next-15-5-26'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: security/next-15-5-26
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate Next 15 dependencies with npm
        run: npm install next@15.5.26 react@19.1.1 react-dom@19.1.1 --save-exact

      - name: Commit generated dependency changes
        id: generated
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(next): migrate to next 15.5.26"
          git push origin HEAD:security/next-15-5-26
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stop after generated lockfile commit
        if: steps.generated.outputs.changed == 'true'
        run: echo "Generated package.json/package-lock.json committed; verification runs on the updated PR commit."

      - name: Clean install
        if: steps.generated.outputs.changed != 'true'
        run: npm ci --ignore-scripts

      - name: Test suite
        if: steps.generated.outputs.changed != 'true'
        run: npm test

      - name: Production build
        if: steps.generated.outputs.changed != 'true'
        run: npm run build
