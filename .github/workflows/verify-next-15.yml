name: Verify Next 15 Migration

on:
  push:
    branches: [security/next-15-5-26]
  workflow_dispatch:

jobs:
  next-15-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: security/next-15-5-26
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install from committed lockfile
        run: npm ci --ignore-scripts

      - name: Audit, test, and build
        shell: bash
        run: |
          set +e

          echo "=== npm audit ==="
          npm audit --omit=dev --audit-level=high
          audit_status=$?

          echo "=== npm test ==="
          npm test
          test_status=$?

          echo "=== npm run build ==="
          npm run build
          build_status=$?

          echo "RESULT | audit=$audit_status tests=$test_status build=$build_status"

          if [ "$audit_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi
