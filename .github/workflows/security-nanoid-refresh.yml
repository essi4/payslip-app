name: Security Nanoid Refresh

on:
  push:
    branches: [security/next-15-5-26]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
      # Trigger dependency refresh from the migration branch.
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/next-15-5-26
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate patched nanoid lock with npm
        run: |
          npm pkg set "overrides.nanoid=3.3.19"
          npm install --package-lock-only --ignore-scripts

      - name: Commit generated package metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): patch nanoid advisory"
          git push origin HEAD:security/next-15-5-26
