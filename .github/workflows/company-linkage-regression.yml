name: Company Linkage Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run company linkage regression
        run: node tests/company-personnel-payslip.test.mjs
      - name: Run employee landing regression
        run: node tests/employee-auth-shell-regression.test.mjs
