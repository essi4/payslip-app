name: Sync ESLint Lockfile

on:
  push:
    branches: [security/next-15-5-26]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: "!contains(github.event.head_commit.message, 'Sync ESLint lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: security/next-15-5-26

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Synchronize package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git commit -m "Sync ESLint lockfile"
          git push origin HEAD:security/next-15-5-26
