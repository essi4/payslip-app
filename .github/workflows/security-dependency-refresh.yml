name: Security Dependency Refresh

on:
  push:
    branches: [security/next-15-5-26]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: security/next-15-5-26
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh patched production dependencies with npm
        run: |
          npm install next@15.5.26 react@19.1.1 react-dom@19.1.1 nodemailer@10.0.10 postcss@8.5.28 --save-exact
          npm pkg set "overrides.nanoid=5.1.6" "overrides.postcss=8.5.28"
          npm install --package-lock-only --ignore-scripts

      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): patch production dependency advisories"
          git push origin HEAD:security/next-15-5-26
